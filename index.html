<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLAYORA — Pick a game. Make it yours.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between selection:bg-purple-500 selection:text-white pb-16 md:pb-0">

    <!-- MASAÜSTÜ ÜST MENÜ -->
    <header class="hidden md:flex items-center justify-between px-8 py-5 border-b border-slate-800/60 bg-slate-900/40 backdrop-blur-md sticky top-0 z-50">
        <div class="flex items-center gap-2 cursor-pointer" onclick="switchPage('home')">
            <span class="text-2xl font-black bg-gradient-to-r from-purple-400 via-indigo-400 to-pink-500 bg-clip-text text-transparent">PLAYORA</span>
        </div>
        <nav class="flex items-center gap-8 text-sm font-medium text-slate-400">
            <button onclick="switchPage('home')" class="hover:text-white transition">Ana Sayfa</button>
            <button onclick="switchPage('games')" class="hover:text-white transition">Oyunlar</button>
            <button onclick="switchPage('leaderboard')" class="hover:text-white transition">Skor Tablosu</button>
            <button onclick="switchPage('profile')" class="hover:text-white transition">Profil</button>
        </nav>
        <button onclick="switchPage('games')" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold px-5 py-2.5 rounded-xl shadow-lg shadow-purple-600/20 transition hover:scale-105 active:scale-95 text-sm">
            PLAY NOW
        </button>
    </header>

    <!-- MOBİL ÜST BAŞLIK -->
    <header class="flex md:hidden items-center justify-between px-5 py-4 border-b border-slate-800/60 bg-slate-900/40 backdrop-blur-md sticky top-0 z-50">
        <span class="text-xl font-black bg-gradient-to-r from-purple-400 via-indigo-400 to-pink-500 bg-clip-text text-transparent">PLAYORA</span>
        <button onclick="switchPage('profile')" class="w-8 h-8 rounded-full bg-purple-600/30 border border-purple-500/40 flex items-center justify-center text-xs font-bold text-purple-300">BU</button>
    </header>

    <!-- ANA İÇERİK ALANI -->
    <main id="app" class="flex-1 max-w-6xl w-full mx-auto px-4 py-6 animate-fade">
        <!-- Sayfalar buraya dinamik yüklenecek -->
    </main>

    <!-- MOBİL ALT NAVİGASYON -->
    <nav class="flex md:hidden fixed bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur-lg border-t border-slate-800/80 px-6 py-3 justify-between items-center z-50 text-xs font-medium text-slate-400">
        <button onclick="switchPage('home')" class="flex flex-col items-center gap-1 hover:text-purple-400 transition"><span>🏠</span> Ana Sayfa</button>
        <button onclick="switchPage('games')" class="flex flex-col items-center gap-1 hover:text-purple-400 transition"><span>🎮</span> Oyunlar</button>
        <button onclick="switchPage('leaderboard')" class="flex flex-col items-center gap-1 hover:text-purple-400 transition"><span>🏆</span> Skorlar</button>
        <button onclick="switchPage('profile')" class="flex flex-col items-center gap-1 hover:text-purple-400 transition"><span>👤</span> Profil</button>
    </nav>

    <!-- FOOTER -->
    <footer class="hidden md:block border-t border-slate-900 py-6 text-center text-xs text-slate-600">
        PLAYORA © 2026 — Pick a game. Make it yours.
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
